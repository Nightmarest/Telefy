[project]
name = "tg-rich-bot"
version = "0.1.0"
description = "Telegram bot for RichMessage MarkdownV2 posts with custom-emoji mosaics"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pillow>=10.4",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
